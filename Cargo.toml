[package]
name = "mouse-tracker"
version = "0.1.0"
edition = "2021"
description = "Records mouse positions and actions with global hotkeys and replays them."

[dependencies]
# Native file dialogs and message boxes.
rfd = "0.15"

[dependencies.windows]
# Pinned exactly: the windows crate changes signatures between minor versions.
version = "=0.58.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
